apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pingboard-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/swinalwaghmare/blue-green-deployment-aws-kubernetes
    targetRevision: staging
    path: helm/pingboard
    helm:
      valueFiles:
      - values.yaml
      parameters:
      - name: deployment.slot
        value: blue
      - name: backend.image.tag
        value: "6"
      - name: frontend.image.tag
        value: "6"
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true